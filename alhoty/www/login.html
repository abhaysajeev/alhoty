<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlHoty Stanger - NDT Portal Login</title>
  <!-- csrf_token -->
  
  <!-- Preload critical images for instant display -->
  <link rel="preload" as="image" href="/assets/alhoty/images/login_background_placeholder.webp" type="image/webp" />
  <link rel="preload" as="image" href="/assets/alhoty/images/login_background.webp" type="image/webp" />
  <link rel="preload" as="image" href="/assets/alhoty/images/inspector.webp" type="image/webp" fetchpriority="high" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Figtree:wght@400;600;700;800&display=swap');

    /* ── Reset ── */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ── Page shell ── */
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: hsl(230, 28%, 88%);
      padding: clamp(16px, 4vw, 40px);
    }

    /* Blurred background layers */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url('/assets/alhoty/images/login_background_placeholder.webp');
      background-size: cover;
      background-position: center;
      filter: blur(20px);
      transform: scale(1.1);
      z-index: -2;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url('/assets/alhoty/images/login_background.webp');
      background-size: cover;
      background-position: center;
      filter: blur(12px);
      transform: scale(1.1);
      opacity: 0;
      z-index: -1;
      animation: fadeInBg 0.7s ease-out 0.1s forwards;
    }

    @media (min-resolution: 2dppx) {
      body::after { background-image: url('/assets/alhoty/images/login_background_hq.webp'); }
    }

    @keyframes fadeInBg { to { opacity: 1; } }
    @keyframes fadeIn   { to { opacity: 1; } }
    @keyframes spin     { to { transform: rotate(360deg); } }
    @keyframes slideUp  {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─────────────────────────────────────────────
       CARD
    ───────────────────────────────────────────── */
    .login-card {
      display: flex;
      width: 100%;
      max-width: min(960px, 100%);
      height: min(540px, calc(100vh - 80px));
      background: rgba(255, 255, 255, 0.93);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.65);
      overflow: hidden;
      box-shadow:
        0 1px 2px rgba(10, 15, 50, 0.04),
        0 6px 20px rgba(10, 15, 50, 0.08),
        0 28px 64px rgba(10, 15, 50, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      animation: slideUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* ─────────────────────────────────────────────
       LEFT — IMAGE PANEL
    ───────────────────────────────────────────── */
    .login-image {
      flex: 0 0 60%;
      position: relative;
      overflow: hidden;
      /* Inset on all sides — image floats inside the card like a photo in a frame */
      margin: 10px 0 10px 10px;
      border-radius: 13px;
      min-height: 0;
    }

    .login-image img.bg-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 65% center;
      display: block;
    }

    /* Dark gradient overlay for text legibility */
    .login-image::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        160deg,
        rgba(8, 12, 35, 0.08) 0%,
        rgba(8, 12, 35, 0.38) 50%,
        rgba(8, 12, 35, 0.80) 100%
      );
      pointer-events: none;
    }

    /* Brand block — pinned to bottom */
    .image-logo {
      position: absolute;
      bottom: 32px;
      left: 32px;
      right: 32px;
      z-index: 1;
    }

    .image-logo-label {
      font-family: 'Figtree', sans-serif;
      font-size: clamp(26px, 2.6vw, 40px);
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
      line-height: 1.12;
      text-shadow:
        0 1px 3px rgba(0, 0, 0, 0.5),
        0 4px 20px rgba(0, 0, 0, 0.35);
      opacity: 0;
      animation: fadeIn 0.5s ease-out 0.3s forwards;
    }

    .image-logo-tagline {
      margin-top: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.65);
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
      opacity: 0;
      animation: fadeIn 0.5s ease-out 0.5s forwards;
    }

    /* ─────────────────────────────────────────────
       RIGHT — FORM PANEL
    ───────────────────────────────────────────── */
    .login-form-section {
      flex: 0 0 40%;
      padding: 28px 32px 24px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 0;
      overflow-y: auto;
      min-width: 0;
      /* Hairline left border — the only separator between image and form */
      border-left: 1px solid hsl(220, 16%, 91%);
    }

    /* Hidden legacy container — keep for Frappe compatibility */
    .logo-container { display: none; }

    /* Welcome heading */
    .welcome-title {
      font-family: 'Figtree', sans-serif;
      font-size: clamp(22px, 2.4vw, 30px);
      font-weight: 800;
      color: hsl(220, 25%, 12%);
      letter-spacing: -0.3px;
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .welcome-subtitle {
      font-size: 13.5px;
      font-weight: 400;
      color: hsl(220, 12%, 52%);
      line-height: 1.5;
      margin-bottom: 16px;
    }

    /* ── Alerts ── */
    .login-error,
    .login-success {
      display: none;
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 13.5px;
      line-height: 1.45;
      margin-bottom: 20px;
    }

    .login-error {
      background: hsl(0, 90%, 97%);
      border: 1px solid hsl(0, 75%, 86%);
      color: hsl(0, 72%, 38%);
    }

    .login-success {
      background: hsl(142, 72%, 96%);
      border: 1px solid hsl(142, 60%, 78%);
      color: hsl(142, 60%, 28%);
    }

    .visible { display: block !important; }

    /* ── Form fields ── */
    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: hsl(220, 18%, 28%);
      margin-bottom: 6px;
      letter-spacing: 0.1px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid hsl(220, 18%, 86%);
      border-radius: 10px;
      font-size: 14.5px;
      font-family: 'Inter', sans-serif;
      color: hsl(220, 22%, 14%);
      background: hsl(220, 20%, 99%);
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      outline: none;
      line-height: 1.5;
    }

    .form-group input:hover:not(:focus) {
      border-color: hsl(220, 18%, 74%);
    }

    .form-group input:focus {
      border-color: hsl(235, 60%, 52%);
      box-shadow:
        0 0 0 3.5px hsla(235, 65%, 55%, 0.14),
        0 1px 3px rgba(0, 0, 0, 0.06);
      background: #ffffff;
    }

    .form-group input::placeholder {
      color: hsl(220, 10%, 62%);
      font-weight: 400;
    }

    /* Password toggle */
    .password-wrapper { position: relative; }

    .password-wrapper input { padding-right: 64px; }

    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 12.5px;
      font-weight: 600;
      color: hsl(220, 14%, 50%);
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.2px;
      padding: 4px 2px;
      transition: color 0.15s;
    }

    .password-toggle:hover { color: hsl(235, 60%, 50%); }

    /* Forgot password row */
    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -4px;
      margin-bottom: 14px;
    }

    .forgot-link {
      font-size: 13px;
      font-weight: 500;
      color: hsl(235, 60%, 50%);
      text-decoration: none;
      transition: color 0.15s;
    }

    .forgot-link:hover {
      color: hsl(235, 60%, 40%);
      text-decoration: underline;
    }

    /* ── Primary button ── */
    .btn-signin {
      width: 100%;
      padding: 11px 20px;
      background: linear-gradient(135deg, hsl(235, 58%, 30%) 0%, hsl(240, 62%, 42%) 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      letter-spacing: 0.2px;
      box-shadow:
        0 1px 2px rgba(30, 40, 120, 0.15),
        0 4px 14px rgba(30, 40, 120, 0.28);
      transition: box-shadow 0.2s ease, transform 0.12s ease, filter 0.2s ease;
    }

    .btn-signin:hover {
      filter: brightness(1.1);
      box-shadow:
        0 2px 4px rgba(30, 40, 120, 0.18),
        0 8px 22px rgba(30, 40, 120, 0.34);
      transform: translateY(-1px);
    }

    .btn-signin:active {
      transform: translateY(0) scale(0.99);
      box-shadow: 0 1px 4px rgba(30, 40, 120, 0.2);
    }

    .btn-signin:disabled {
      opacity: 0.80;
      cursor: not-allowed;
      transform: none;
    }

    .btn-signin .btn-spinner {
      display: inline-block;
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 12px 0;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: hsl(220, 18%, 88%);
    }

    .divider span {
      font-size: 12px;
      font-weight: 500;
      color: hsl(220, 10%, 58%);
      white-space: nowrap;
      letter-spacing: 0.2px;
    }

    /* ── Secondary button ── */
    .btn-email-link {
      width: 100%;
      padding: 11px 20px;
      background: transparent;
      color: hsl(220, 18%, 28%);
      border: 1.5px solid hsl(220, 18%, 84%);
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
    }

    .btn-email-link:hover {
      background: hsl(220, 22%, 96%);
      border-color: hsl(220, 18%, 72%);
      color: hsl(220, 18%, 18%);
    }

    /* ── Footer ── */
    .footer-text {
      text-align: center;
      font-size: 11.5px;
      color: hsl(220, 10%, 62%);
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid hsl(220, 20%, 92%);
      letter-spacing: 0.1px;
    }

    /* ─────────────────────────────────────────────
       RESPONSIVE
    ───────────────────────────────────────────── */

    /* Tablet — stack vertically */
    @media (max-width: 768px) {
      body { align-items: flex-start; padding: 20px 16px; }

      .login-card {
        flex-direction: column;
        max-width: 460px;
        height: auto;
        margin: 0 auto;
      }

      .login-image {
        flex: none;
        height: 180px;
        margin: 10px 10px 0 10px;
        border-radius: 10px;
      }

      .login-image img.bg-photo { object-position: center 30%; }

      .image-logo { bottom: 20px; left: 20px; right: 20px; }

      .image-logo-label { font-size: clamp(20px, 5vw, 28px); }

      .login-form-section {
        flex: 1 1 auto;
        border-left: none;
        border-top: 1px solid hsl(220, 16%, 91%);
        padding: 22px 24px 20px;
        overflow-y: auto;
      }
    }

    /* Mobile — compact */
    @media (max-width: 480px) {
      body { padding: 12px; }

      .login-card { border-radius: 20px; }

      .login-image { height: 150px; margin: 8px 8px 0 8px; border-radius: 8px; }

      .login-form-section { padding: 20px 20px 16px; }
    }

    /* Very small — squeeze further */
    @media (max-width: 360px) {
      .login-form-section { padding: 20px 18px 18px; }

      .welcome-title { font-size: 20px; }

      .welcome-subtitle { margin-bottom: 18px; }
    }
  </style>
</head>

<body>
  <div class="login-card">

    <!-- ── Left: Background Image + Logo overlay ── -->
    <div class="login-image">
      <picture>
        <source srcset="/assets/alhoty/images/inspector.webp" type="image/webp">
        <img class="bg-photo" src="/assets/alhoty/images/inspector.jpg" alt="AlHoty Stanger Inspector" loading="eager" decoding="sync" fetchpriority="high" />
      </picture>

      <!-- brand block pinned to bottom of image panel -->
      <div class="image-logo">
        <div class="image-logo-label">NDT Management<br>System</div>
        <div class="image-logo-tagline">Al Hoty Stanger Ltd. Co.</div>
      </div>
    </div>

    <!-- ── Right: Login Form ── -->
    <div class="login-form-section">
      <h1 class="welcome-title">Welcome Back</h1>
      <p class="welcome-subtitle">Sign in to your NDT Portal account</p>

      <div class="login-error" id="loginError"></div>
      <div class="login-success" id="loginSuccess"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="text" id="email" name="usr" placeholder="Enter email" required
            autocomplete="username" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" name="pwd" placeholder="Enter your password" required
              autocomplete="current-password" />
            <button type="button" class="password-toggle" onclick="togglePassword()">Show</button>
          </div>
        </div>

        <div class="forgot-row">
          <a href="#" class="forgot-link" onclick="handleForgotPassword(event)">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-signin" id="btnSignin">
          <span class="btn-spinner" id="btnSpinner" style="display:none;"></span>
          <span id="btnText">Sign In</span>
        </button>
      </form>

      <div class="divider">
        <span>Or continue with</span>
      </div>

      <button class="btn-email-link" onclick="handleEmailLink()">
        Login with Email Link
      </button>

      <p class="footer-text">&copy; 2025 AlHoty Stanger &middot; NDT Portal</p>
    </div>
  </div>

  <script>
    // ── Helpers ──
    function showError(msg) {
      hideSuccess();
      var el = document.getElementById('loginError');
      el.textContent = msg;
      el.classList.add('visible');
    }

    function hideError() {
      document.getElementById('loginError').classList.remove('visible');
    }

    function showSuccess(msg) {
      hideError();
      var el = document.getElementById('loginSuccess');
      el.textContent = msg;
      el.classList.add('visible');
    }

    function hideSuccess() {
      document.getElementById('loginSuccess').classList.remove('visible');
    }

    function getCSRFToken() {
      if (typeof frappe !== 'undefined' && frappe.csrf_token) {
        return frappe.csrf_token;
      }
      var match = document.cookie.match(/csrf_token=([^;]+)/);
      return match ? decodeURIComponent(match[1]) : '';
    }

    // ── Login ──
    function handleLogin(e) {
      e.preventDefault();
      hideError();
      hideSuccess();

      var btn = document.getElementById('btnSignin');
      var usr = document.getElementById('email').value.trim();
      var pwd = document.getElementById('password').value;

      if (!usr || !pwd) {
        showError('Please enter both email and password.');
        return;
      }

      btn.disabled = true;
      document.getElementById('btnSpinner').style.display = 'inline-block';
      document.getElementById('btnText').textContent = 'Signing in\u2026';

      fetch('/api/method/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json',
          'X-Frappe-CSRF-Token': getCSRFToken()
        },
        body: JSON.stringify({ usr: usr, pwd: pwd })
      })
        .then(function (res) {
          if (res.ok) return res.json();
          return res.json().then(function (data) { throw data; });
        })
        .then(function (data) {
          // Keep spinner showing — page is about to navigate
          document.getElementById('btnText').textContent = 'Redirecting\u2026';
          var params = new URLSearchParams(window.location.search);
          var redirect = params.get('redirect-to');
          window.location.href = redirect || '/app';
        })
        .catch(function (err) {
          // Only reset button on failure
          btn.disabled = false;
          document.getElementById('btnSpinner').style.display = 'none';
          document.getElementById('btnText').textContent = 'Sign In';
          var message = 'Invalid credentials. Please try again.';
          if (err && err._server_messages) {
            try {
              var msgs = JSON.parse(err._server_messages);
              message = JSON.parse(msgs[0]).message || message;
            } catch (e) { }
          } else if (err && err.message) {
            message = err.message;
          }
          showError(message);
        });
    }

    // ── Forgot Password ──
    function handleForgotPassword(e) {
      e.preventDefault();
      var email = document.getElementById('email').value.trim();
      if (!email) {
        showError('Please enter your email address first, then click Forgot Password.');
        return;
      }
      hideError();

      fetch('/api/method/frappe.core.doctype.user.user.reset_password', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Frappe-CSRF-Token': getCSRFToken()
        },
        body: JSON.stringify({ user: email })
      })
        .then(function (res) { return res.json(); })
        .then(function () {
          showSuccess('Password reset link sent to ' + email + '. Check your inbox.');
        })
        .catch(function () {
          showError('Could not send reset link. Please check your email and try again.');
        });
    }

    // ── Email Link Login ──
    function handleEmailLink() {
      var email = document.getElementById('email').value.trim();
      if (!email) {
        showError('Please enter your email address first.');
        return;
      }
      hideError();

      fetch('/api/method/frappe.www.login.send_login_link', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Frappe-CSRF-Token': getCSRFToken()
        },
        body: JSON.stringify({ email: email })
      })
        .then(function (res) { return res.json(); })
        .then(function () {
          showSuccess('Login link sent to ' + email + '. Check your inbox.');
        })
        .catch(function () {
          showError('Could not send login link. Please try again.');
        });
    }

    // ── Password Toggle ──
    function togglePassword() {
      var input = document.getElementById('password');
      var btn = input.nextElementSibling;
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = 'Hide';
      } else {
        input.type = 'password';
        btn.textContent = 'Show';
      }
    }
  </script>
</body>

</html>
