<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlHoty Stanger - NDT Portal Login</title>
  <!-- csrf_token -->

  <link rel="preload" as="image" href="/assets/alhoty/images/login_background_placeholder.webp" type="image/webp" />
  <link rel="preload" as="image" href="/assets/alhoty/images/login_background.webp" type="image/webp" />
  <link rel="preload" as="image" href="/assets/alhoty/images/inspector.webp" type="image/webp" fetchpriority="high" />
  <link rel="preload" as="image" href="/assets/alhoty/images/logo_new.png" type="image/png" fetchpriority="high" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Figtree:wght@400;600;700;800&display=swap');

    /* ── Design tokens ── */
    :root {
      --brand-deep:   #0E1650;
      --brand-core:   #1A2490;
      --brand-light:  #2840D8;
      --brand-gold:   #C4973A;
      --brand-gold-lt:#E2B55C;
      --surface:      #F7F8FF;
      --slate-950:    #080E1E;
      --slate-800:    #1C2540;
      --slate-600:    #48567A;
      --slate-400:    #8C97B8;
      --slate-300:    #B4BCE0;
      --slate-200:    #D6DAEA;
      --slate-100:    #EDF0F7;
      --focus-ring:   hsla(230, 68%, 58%, 0.20);
      --green-live:   #22C55E;
    }

    /* ── Reset ── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── Body ── */
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: hsl(230, 28%, 82%);
      padding: clamp(16px, 4vw, 40px);
    }

    /* Blurred background layers */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url('/assets/alhoty/images/login_background_placeholder.webp');
      background-size: cover;
      background-position: center;
      filter: blur(24px);
      transform: scale(1.1);
      z-index: -2;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url('/assets/alhoty/images/login_background.webp');
      background-size: cover;
      background-position: center;
      filter: blur(14px);
      transform: scale(1.1);
      opacity: 0;
      z-index: -1;
      animation: fadeInBg 0.8s ease-out 0.1s forwards;
    }

    @media (min-resolution: 2dppx) {
      body::after { background-image: url('/assets/alhoty/images/login_background_hq.webp'); }
    }

    @keyframes fadeInBg  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeIn    { from { opacity: 0; } to { opacity: 1; } }
    @keyframes spin      { to { transform: rotate(360deg); } }
    @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes slideUp   {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      from { background-position: -200% center; }
      to   { background-position:  200% center; }
    }

    /* ════════════════════════════════════
       CARD
    ════════════════════════════════════ */
    .login-card {
      position: relative;
      display: flex;
      width: 100%;
      max-width: min(980px, 100%);
      height: min(568px, calc(100vh - 80px));
      background: rgba(255,255,255, 0.96);
      backdrop-filter: blur(36px) saturate(200%);
      -webkit-backdrop-filter: blur(36px) saturate(200%);
      border-radius: 22px;
      border: 1px solid rgba(255,255,255, 0.72);
      overflow: hidden;
      box-shadow:
        0 1px 2px   rgba(8,14,50, 0.04),
        0 8px 24px  rgba(8,14,50, 0.10),
        0 36px 88px rgba(8,14,50, 0.22),
        inset 0 1px 0 rgba(255,255,255, 0.95);
      animation: slideUp 0.48s cubic-bezier(0.22,1,0.36,1) both;
    }

    /* Three-colour accent bar at top */
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg,
        var(--brand-deep)  0%,
        var(--brand-light) 52%,
        var(--brand-gold)  100%
      );
      border-radius: 22px 22px 0 0;
      z-index: 10;
    }

    /* ════════════════════════════════════
       LEFT — IMAGE PANEL
    ════════════════════════════════════ */
    .login-image {
      flex: 0 0 58%;
      position: relative;
      overflow: hidden;
      margin: 10px 0 10px 10px;
      border-radius: 14px;
      min-height: 0;
      /* Placeholder colour shown instantly while inspector.webp loads */
      background: linear-gradient(168deg, #1a2a5e 0%, #0e1650 100%);
    }

    .login-image img.bg-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 65% center;
      display: block;
    }

    /* Cinematic gradient — heavy at bottom, airy at top */
    .login-image::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        168deg,
        rgba(6,10,28, 0.06)   0%,
        rgba(6,10,28, 0.18)  28%,
        rgba(6,10,28, 0.52)  62%,
        rgba(6,10,28, 0.90) 100%
      );
      pointer-events: none;
    }

    /* Brand block — pinned bottom */
    .image-logo {
      position: absolute;
      bottom: 28px;
      left: 28px;
      right: 28px;
      z-index: 2;
    }

    /* Gold accent line above title */
    .image-logo-line {
      width: 32px;
      height: 2px;
      background: linear-gradient(90deg, var(--brand-gold), transparent);
      margin-bottom: 13px;
      animation: fadeIn 0.4s ease-out 0.22s both;
    }

    .image-logo-label {
      font-family: 'Figtree', sans-serif;
      font-size: clamp(32px, 3.8vw, 52px);
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.6px;
      line-height: 1.10;
      text-shadow:
        0 1px 4px  rgba(0,0,0, 0.55),
        0 4px 24px rgba(0,0,0, 0.35);
      animation: fadeIn 0.5s ease-out 0.3s both;
    }

    .image-logo-tagline {
      margin-top: 12px;
      font-size: clamp(11px, 1.1vw, 14px);
      font-weight: 600;
      color: rgba(255,255,255, 0.65);
      letter-spacing: 3.5px;
      text-transform: uppercase;
      text-shadow: 0 1px 6px rgba(0,0,0, 0.5);
      animation: fadeIn 0.5s ease-out 0.5s both;
    }

    /* ════════════════════════════════════
       RIGHT — FORM PANEL
    ════════════════════════════════════ */
    .login-form-section {
      flex: 0 0 42%;
      padding: 30px 36px 26px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow-y: auto;
      min-width: 0;
      border-left: 1px solid hsl(230, 25%, 91%);
      /* Subtle blue-tinted radial gradient — not flat white */
      background:
        radial-gradient(ellipse at 85% -5%,  hsla(230, 70%, 97%, 0.85) 0%, transparent 52%),
        radial-gradient(ellipse at 10% 105%, hsla(220, 45%, 96%, 0.60) 0%, transparent 46%),
        #ffffff;
    }

    .logo-container { display: none; }

    /* ── Brand header ── */
    .form-brand {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 18px;
    }

    /* Company logo */
    .brand-mark {
      width: 72px;
      height: 72px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-name {
      font-family: 'Figtree', sans-serif;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--brand-deep);
      letter-spacing: 0.1px;
      line-height: 1;
    }

    .brand-sub {
      font-size: 10px;
      font-weight: 600;
      color: var(--brand-gold);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Separator */
    .form-sep {
      height: 1px;
      background: linear-gradient(90deg, var(--slate-200) 0%, transparent 88%);
      margin-bottom: 18px;
    }

    /* Welcome text */
    .welcome-title {
      font-family: 'Figtree', sans-serif;
      font-size: clamp(21px, 2.1vw, 27px);
      font-weight: 800;
      color: var(--slate-950);
      letter-spacing: -0.4px;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .welcome-subtitle {
      font-size: 13px;
      font-weight: 400;
      color: var(--slate-400);
      line-height: 1.5;
      margin-bottom: 18px;
    }

    /* ── Alerts ── */
    .login-error,
    .login-success {
      display: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 14px;
    }

    .login-error {
      background: hsl(0, 90%, 97%);
      border: 1px solid hsl(0, 75%, 88%);
      color: hsl(0, 65%, 40%);
    }

    .login-success {
      background: hsl(142, 72%, 96%);
      border: 1px solid hsl(142, 60%, 78%);
      color: hsl(142, 60%, 28%);
    }

    .visible { display: block !important; }

    /* ── Form fields ── */
    .form-group { margin-bottom: 12px; }

    .form-group label {
      display: block;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--slate-600);
      margin-bottom: 6px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    /* Input wrapper — holds icon + input */
    .input-wrap { position: relative; }

    .input-wrap .field-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      color: var(--slate-300);
      pointer-events: none;
      transition: color 0.18s;
    }

    .input-wrap:focus-within .field-icon {
      color: var(--brand-core);
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px 10px 40px;
      border: 1.5px solid var(--slate-200);
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      color: var(--slate-950);
      background: hsl(225, 22%, 99%);
      transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
      outline: none;
      line-height: 1.5;
    }

    .form-group input:hover:not(:focus) {
      border-color: hsl(220, 18%, 74%);
    }

    .form-group input:focus {
      border-color: var(--brand-core);
      box-shadow:
        0 0 0 3.5px var(--focus-ring),
        0 1px 3px rgba(0,0,0, 0.06);
      background: #ffffff;
    }

    .form-group input::placeholder {
      color: hsl(220, 10%, 70%);
      font-weight: 400;
    }

    /* Password — icon left, toggle right */
    .pw-wrap { position: relative; }

    .pw-wrap input { padding-right: 64px; }

    .password-toggle {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--slate-400);
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 4px 2px;
      transition: color 0.15s;
    }

    .password-toggle:hover { color: var(--brand-core); }

    /* Forgot link */
    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -4px;
      margin-bottom: 14px;
    }

    .forgot-link {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--brand-core);
      text-decoration: none;
      transition: color 0.15s;
    }

    .forgot-link:hover { color: var(--brand-deep); text-decoration: underline; }

    /* ── Sign In button ── */
    .btn-signin {
      width: 100%;
      padding: 12px 20px;
      background: linear-gradient(135deg,
        var(--brand-deep)  0%,
        var(--brand-core)  50%,
        var(--brand-light) 100%
      );
      color: #fff;
      border: none;
      border-radius: 11px;
      font-size: 14.5px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      letter-spacing: 0.25px;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 1px 2px   rgba(14,22,80, 0.20),
        0 4px 16px  rgba(26,36,144, 0.34),
        inset 0 1px 0 rgba(255,255,255, 0.10);
      transition: box-shadow 0.22s ease, transform 0.12s ease, filter 0.22s ease;
    }

    /* Moving shimmer on hover */
    .btn-signin::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        105deg,
        transparent 30%,
        rgba(255,255,255, 0.16) 50%,
        transparent 70%
      );
      background-size: 200% 100%;
      opacity: 0;
    }

    .btn-signin:hover {
      filter: brightness(1.09);
      transform: translateY(-1.5px);
      box-shadow:
        0 2px 4px   rgba(14,22,80, 0.22),
        0 10px 32px rgba(26,36,144, 0.44),
        inset 0 1px 0 rgba(255,255,255, 0.12);
    }

    .btn-signin:hover::after {
      opacity: 1;
      animation: shimmer 0.75s ease forwards;
    }

    .btn-signin:active {
      transform: translateY(0) scale(0.99);
      box-shadow: 0 1px 6px rgba(14,22,80, 0.24);
      filter: brightness(1);
    }

    .btn-signin:disabled {
      opacity: 0.76;
      cursor: not-allowed;
      transform: none;
    }

    .btn-spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255, 0.28);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    /* Security micro-label below button */
    .security-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-top: 9px;
      margin-bottom: 4px;
    }

    .security-row svg {
      width: 11px;
      height: 11px;
      color: var(--slate-300);
      flex-shrink: 0;
    }

    .security-row span {
      font-size: 10.5px;
      color: var(--slate-400);
      letter-spacing: 0.1px;
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--slate-200);
    }

    .divider span {
      font-size: 11px;
      font-weight: 500;
      color: var(--slate-400);
      white-space: nowrap;
      letter-spacing: 0.2px;
    }

    /* ── Email link button ── */
    .btn-email-link {
      width: 100%;
      padding: 10px 20px;
      background: transparent;
      color: var(--slate-800);
      border: 1.5px solid var(--slate-200);
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s, color 0.18s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-email-link svg {
      width: 14px;
      height: 14px;
      color: var(--slate-400);
      flex-shrink: 0;
      transition: color 0.18s;
    }

    .btn-email-link:hover {
      background: var(--slate-100);
      border-color: hsl(220,18%,78%);
      color: var(--slate-950);
    }

    .btn-email-link:hover svg { color: var(--brand-core); }

    /* ── Footer ── */
    .footer-text {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 10.5px;
      color: var(--slate-400);
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--slate-100);
      letter-spacing: 0.1px;
    }

    /* ════════════════════════════════════
       RESPONSIVE
    ════════════════════════════════════ */
    @media (max-width: 768px) {
      body { align-items: flex-start; padding: 20px 16px; }

      .login-card {
        flex-direction: column;
        max-width: 460px;
        height: auto;
        margin: 0 auto;
      }

      .login-image {
        flex: none;
        height: 180px;
        margin: 10px 10px 0 10px;
        border-radius: 10px;
      }

      .login-image img.bg-photo { object-position: center 30%; }
      .image-logo { bottom: 20px; left: 20px; right: 20px; }
      .image-logo-label { font-size: clamp(20px, 5vw, 28px); }

      .login-form-section {
        flex: 1 1 auto;
        border-left: none;
        border-top: 1px solid hsl(220,16%,91%);
        padding: 22px 24px 20px;
      }
    }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .login-card { border-radius: 20px; }
      .login-image { height: 150px; margin: 8px 8px 0 8px; border-radius: 8px; }
      .login-form-section { padding: 20px 20px 16px; }
    }

    @media (max-width: 360px) {
      .login-form-section { padding: 20px 18px 18px; }
      .welcome-title { font-size: 20px; }
      .welcome-subtitle { margin-bottom: 14px; }
    }
  </style>
</head>

<body>
  <div class="login-card">

    <!-- ── Left: Image panel ── -->
    <div class="login-image">
      <picture>
        <source srcset="/assets/alhoty/images/inspector.webp" type="image/webp">
        <img class="bg-photo" src="/assets/alhoty/images/inspector.jpg"
          alt="AlHoty Stanger Inspector" loading="eager" decoding="sync" fetchpriority="high" />
      </picture>

      <!-- Brand block -->
      <div class="image-logo">
        <div class="image-logo-line"></div>
        <div class="image-logo-label">NDT Management<br>System</div>
        <div class="image-logo-tagline">Al Hoty Stanger Ltd. Co.</div>
      </div>
    </div>

    <!-- ── Right: Form panel ── -->
    <div class="login-form-section">

      <!-- Brand header -->
      <div class="form-brand">
        <img class="brand-mark" src="/assets/alhoty/images/logo_new.png" alt="Al Hoty Stanger Logo" />

        <div class="brand-text">
          <span class="brand-name">Al Hoty Stanger Ltd. Co.</span>
          <span class="brand-sub">NDT Inspection Platform</span>
        </div>
      </div>

      <div class="form-sep"></div>

      <h1 class="welcome-title">Welcome Back</h1>
      <p class="welcome-subtitle">Sign in to your NDT Portal account</p>

      <div class="login-error" id="loginError"></div>
      <div class="login-success" id="loginSuccess"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <svg class="field-icon" viewBox="0 0 16 16" fill="none"
              stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <rect x="1.5" y="3.5" width="13" height="9" rx="1.5"/>
              <path d="M1.5 5.5 L8 10 L14.5 5.5" stroke-linejoin="round"/>
            </svg>
            <input type="text" id="email" name="usr"
              placeholder="Enter your email" required autocomplete="username" />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap pw-wrap">
            <svg class="field-icon" viewBox="0 0 16 16" fill="none"
              stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <rect x="2.5" y="7.5" width="11" height="7" rx="1.5"/>
              <path d="M5 7.5 V5.5 a3 3 0 0 1 6 0 V7.5" stroke-linecap="round"/>
              <circle cx="8" cy="11.2" r="1" fill="currentColor" stroke="none"/>
            </svg>
            <input type="password" id="password" name="pwd"
              placeholder="Enter your password" required autocomplete="current-password" />
            <button type="button" class="password-toggle" onclick="togglePassword()">Show</button>
          </div>
        </div>

        <div class="forgot-row">
          <a href="#" class="forgot-link" onclick="handleForgotPassword(event)">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-signin" id="btnSignin">
          <span class="btn-spinner" id="btnSpinner" style="display:none;"></span>
          <span id="btnText">Sign In</span>
        </button>
      </form>

      <!-- Security micro-label -->
      <div class="security-row">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M6 1 L10.5 3.2 V6.8 C10.5 9 8.5 10.8 6 11.5 C3.5 10.8 1.5 9 1.5 6.8 V3.2 Z"
            stroke-linejoin="round"/>
          <path d="M4 6 L5.4 7.4 L8 4.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>SSL encrypted · Secure sign-in</span>
      </div>

      <div class="divider"><span>Or continue with</span></div>

      <button class="btn-email-link" onclick="handleEmailLink()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="1.5" y="3.5" width="13" height="9" rx="1.5"/>
          <path d="M1.5 5.5 L8 10 L14.5 5.5" stroke-linejoin="round"/>
        </svg>
        Login with Email Link
      </button>

      <p class="footer-text">
        &copy; 2025 AlHoty Stanger &middot; NDT Portal
      </p>
    </div>
  </div>

  <script>
    function showError(msg) {
      hideSuccess();
      var el = document.getElementById('loginError');
      el.textContent = msg;
      el.classList.add('visible');
    }

    function hideError() {
      document.getElementById('loginError').classList.remove('visible');
    }

    function showSuccess(msg) {
      hideError();
      var el = document.getElementById('loginSuccess');
      el.textContent = msg;
      el.classList.add('visible');
    }

    function hideSuccess() {
      document.getElementById('loginSuccess').classList.remove('visible');
    }

    function getCSRFToken() {
      if (typeof frappe !== 'undefined' && frappe.csrf_token) {
        return frappe.csrf_token;
      }
      var match = document.cookie.match(/csrf_token=([^;]+)/);
      return match ? decodeURIComponent(match[1]) : '';
    }

    function handleLogin(e) {
      e.preventDefault();
      hideError();
      hideSuccess();

      var btn = document.getElementById('btnSignin');
      var usr = document.getElementById('email').value.trim();
      var pwd = document.getElementById('password').value;

      if (!usr || !pwd) {
        showError('Please enter both email and password.');
        return;
      }

      btn.disabled = true;
      document.getElementById('btnSpinner').style.display = 'inline-block';
      document.getElementById('btnText').textContent = 'Signing in\u2026';

      fetch('/api/method/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json',
          'X-Frappe-CSRF-Token': getCSRFToken()
        },
        body: JSON.stringify({ usr: usr, pwd: pwd })
      })
        .then(function (res) {
          if (res.ok) return res.json();
          return res.json().then(function (data) { throw data; });
        })
        .then(function () {
          document.getElementById('btnText').textContent = 'Redirecting\u2026';
          var params = new URLSearchParams(window.location.search);
          var redirect = params.get('redirect-to');
          window.location.href = redirect || '/app';
        })
        .catch(function (err) {
          btn.disabled = false;
          document.getElementById('btnSpinner').style.display = 'none';
          document.getElementById('btnText').textContent = 'Sign In';
          var message = 'Invalid credentials. Please try again.';
          if (err && err._server_messages) {
            try {
              var msgs = JSON.parse(err._server_messages);
              message = JSON.parse(msgs[0]).message || message;
            } catch (e) {}
          } else if (err && err.message) {
            message = err.message;
          }
          showError(message);
        });
    }

    function handleForgotPassword(e) {
      e.preventDefault();
      var email = document.getElementById('email').value.trim();
      if (!email) {
        showError('Please enter your email address first, then click Forgot Password.');
        return;
      }
      hideError();

      fetch('/api/method/frappe.core.doctype.user.user.reset_password', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Frappe-CSRF-Token': getCSRFToken()
        },
        body: JSON.stringify({ user: email })
      })
        .then(function (res) { return res.json(); })
        .then(function () {
          showSuccess('Password reset link sent to ' + email + '. Check your inbox.');
        })
        .catch(function () {
          showError('Could not send reset link. Please check your email and try again.');
        });
    }

    function handleEmailLink() {
      var email = document.getElementById('email').value.trim();
      if (!email) {
        showError('Please enter your email address first.');
        return;
      }
      hideError();

      fetch('/api/method/frappe.www.login.send_login_link', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Frappe-CSRF-Token': getCSRFToken()
        },
        body: JSON.stringify({ email: email })
      })
        .then(function (res) { return res.json(); })
        .then(function () {
          showSuccess('Login link sent to ' + email + '. Check your inbox.');
        })
        .catch(function () {
          showError('Could not send login link. Please try again.');
        });
    }

    function togglePassword() {
      var input = document.getElementById('password');
      var btn = input.nextElementSibling;
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = 'Hide';
      } else {
        input.type = 'password';
        btn.textContent = 'Show';
      }
    }
  </script>
</body>

</html>
